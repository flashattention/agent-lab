[project]
name = "agentlab-backend"
version = "0.1.0"
description = "AgentLab API: 격리된 Python 실행 샌드박스, 코드 검증, LLM 고도화 캐시"
authors = [
    { name = "flashattention", email = "wjss5115@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepagents>=0.7.32",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-supervisor>=0.0.31",
    "langgraph-swarm>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "qdrant-client>=1.20.0",
    "ruff>=0.17.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["E501", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"sandbox/sitecustomize.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
