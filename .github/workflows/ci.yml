name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AGENTLAB_NPROC_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (sandbox · guard · policy · key proxy · tracer · auth · API · 13 generated patterns)
        run: uv run pytest -q

  frontend:
    name: Frontend (lint · typecheck · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  content:
    name: Lesson code (run every example & solution)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AGENTLAB_NPROC_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run python scripts/check_content.py

  database:
    name: Database (schema · RLS · grants)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
      # 스키마를 두 번 적용해 여러 번 실행해도 안전한지(멱등성)까지 확인한다
      - run: psql -q -v ON_ERROR_STOP=1 -f supabase/tests/stub.sql -f supabase/schema.sql -f supabase/schema.sql -f supabase/tests/rls_test.sql
